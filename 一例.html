<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一粒小兔豆</title>
    <style>
        /* 设置黑色背景 */
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; /* 防止滚动条 */
        }

        /* 随机大小和位置的白色评论框 */
        .comment {
            position: absolute;
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            color: black;
            font-family: 'Arial', sans-serif;
            word-wrap: break-word;
            opacity: 0; /* 初始时设置为透明 */
            transition: opacity 1s ease-in-out; /* 渐变效果 */
            font-weight: bold; /* 字体加粗 */
        }

        /* 设定评论框的最大宽度和最大高度 */
        .comment-content {
            max-width: 100%; /* 让评论内容充满评论框 */
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <script>
        // 生成随机数的函数
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // 创建一个评论框
        function createComment(text) {
            const commentDiv = document.createElement('div');
            commentDiv.classList.add('comment');

            // 根据屏幕尺寸设定评论框最大尺寸和字体大小
            const maxWidth = window.innerWidth / 8; // 最大宽度：屏幕宽度的八分之一
            const maxHeight = window.innerHeight / 8; // 最大高度：屏幕高度的八分之一
            const width = getRandomInt(150, maxWidth); // 宽度范围
            const height = getRandomInt(100, maxHeight); // 高度范围
            const fontSize = Math.max(16, Math.min(24, Math.floor(width / 15))); // 根据宽度设置字体大小，确保字体足够大

            commentDiv.style.width = `${width}px`;
            commentDiv.style.height = `${height}px`;
            commentDiv.style.fontSize = `${fontSize}px`;

            // 随机设定评论框的位置
            const top = getRandomInt(0, window.innerHeight - height); // 垂直位置
            const left = getRandomInt(0, window.innerWidth - width); // 水平位置
            commentDiv.style.top = `${top}px`;
            commentDiv.style.left = `${left}px`;

            // 设置评论框内容
            const contentDiv = document.createElement('div');
            contentDiv.classList.add('comment-content');
            contentDiv.textContent = text;

            commentDiv.appendChild(contentDiv);

            // 将评论框添加到页面中
            document.body.appendChild(commentDiv);

            // 显示评论框
            setTimeout(() => {
                commentDiv.style.opacity = 1; // 显示时使用渐变透明度
            }, 50); // 延迟一点点时间，确保元素加载后再显示

            // 评论框消失
            setTimeout(() => {
                commentDiv.style.opacity = 0; // 渐变消失
                setTimeout(() => {
                    commentDiv.remove(); // 移除评论框
                }, 1000); // 等待消失动画完成后再删除
            }, 4000); // 4秒后开始消失
        }

        // 定义夸奖女生好看的评论文本
        const comments = [
            "你真是太美了，简直是天使下凡！",
            "每次看到你，都会被你的美丽深深吸引。",
            "你的笑容就像阳光一样温暖，真让人陶醉。",
            "我从没见过这么迷人的人，真是无可挑剔！",
            "你的一颦一笑都充满了魅力，真让人忍不住想靠近。",
            "你的美丽不仅仅在外表，内在的气质也无与伦比。",
            "你的眼睛像星星一样闪亮，真是太美了！",
            "你的每一寸肌肤都散发着光辉，真是美得不可思议！"
        ];

        // 延迟逐个弹出评论框
        let commentIndex = 0;
        const commentInterval = setInterval(() => {
            if (commentIndex < comments.length) {
                createComment(comments[commentIndex]);
                commentIndex++;
            } else {
                clearInterval(commentInterval); // 所有评论弹出后停止
            }
        }, 1500); // 每隔1.5秒弹出一个评论框
    </script>
</body>
</html>
