<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态文字流</title>
    <style>
        /* 设置黑色背景 */
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* 文字流的动画效果 */
        .flowing-text {
            position: absolute;
            font-weight: bold;
            opacity: 0;
            white-space: nowrap;
            animation-timing-function: linear;
        }

        /* 控制面板的样式 */
        .control-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 8px;
            color: white;
            z-index: 999;
        }

        .control-panel input, .control-panel button {
            margin-top: 10px;
            width: 200px;
            padding: 8px;
            font-size: 16px;
        }

        /* 按键提示 */
        .key-info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            z-index: 1000;
        }

        /* 控制面板按钮 */
        .control-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #333;
            color: white;
            padding: 15px;
            font-size: 18px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="key-info">按 Ctrl + P 打开控制面板（桌面版）</div>

    <!-- 控制面板 -->
    <div class="control-panel" id="controlPanel">
        <h3>添加新的文字流</h3>
        <input type="text" id="textInput" placeholder="输入新文字流内容" />
        <input type="number" id="durationInput" placeholder="持续时间（秒）" />
        <button onclick="addTextFlow()">添加文字流</button>
    </div>

    <!-- 控制面板按钮（手机端） -->
    <button class="control-button" onclick="toggleControlPanel()">控制面板</button>

    <script>
        // 按键触发打开/关闭控制面板（桌面版）
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.key === 'p') {
                const controlPanel = document.getElementById('controlPanel');
                controlPanel.style.display = controlPanel.style.display === 'block' ? 'none' : 'block';
            }
        });

        // 按钮触发打开/关闭控制面板（手机端）
        function toggleControlPanel() {
            const controlPanel = document.getElementById('controlPanel');
            controlPanel.style.display = controlPanel.style.display === 'block' ? 'none' : 'block';
        }

        // 随机生成文字流的动画
        function createTextFlow(text, duration) {
            const directions = ['left', 'right', 'top', 'bottom'];
            const direction = directions[Math.floor(Math.random() * directions.length)];

            // 随机生成字体大小（在合理范围内）
            const fontSize = Math.floor(Math.random() * (36 - 16 + 1)) + 16; // 字体大小范围 16px - 36px

            // 随机生成颜色
            const randomColor = getRandomColor();

            // 创建文字流元素
            const textElement = document.createElement('div');
            textElement.classList.add('flowing-text');
            textElement.textContent = text;
            textElement.style.fontSize = `${fontSize}px`;
            textElement.style.color = randomColor;

            // 设置动画方向
            if (direction === 'left') {
                textElement.style.left = '100%';
                textElement.style.top = `${Math.random() * window.innerHeight}px`;
                textElement.style.animation = `flowLeft ${duration}s infinite`;
            } else if (direction === 'right') {
                textElement.style.left = `-${text.length * 15}px`;
                textElement.style.top = `${Math.random() * window.innerHeight}px`;
                textElement.style.animation = `flowRight ${duration}s infinite`;
            } else if (direction === 'top') {
                textElement.style.top = '100%';
                textElement.style.left = `${Math.random() * window.innerWidth}px`;
                textElement.style.animation = `flowTop ${duration}s infinite`;
            } else {
                textElement.style.top = `-${text.length * 15}px`;
                textElement.style.left = `${Math.random() * window.innerWidth}px`;
                textElement.style.animation = `flowBottom ${duration}s infinite`;
            }

            // 添加到页面
            document.body.appendChild(textElement);
        }

        // 为文字流添加CSS动画
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes flowLeft {
                0% { left: 100%; opacity: 1; }
                100% { left: -100%; opacity: 0; }
            }
            @keyframes flowRight {
                0% { left: -100%; opacity: 1; }
                100% { left: 100%; opacity: 0; }
            }
            @keyframes flowTop {
                0% { top: 100%; opacity: 1; }
                100% { top: -100%; opacity: 0; }
            }
            @keyframes flowBottom {
                0% { top: -100%; opacity: 1; }
                100% { top: 100%; opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // 生成随机颜色（RGB格式）
        function getRandomColor() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            return `rgb(${r}, ${g}, ${b})`;
        }

        // 添加新的文字流
        function addTextFlow() {
            const textInput = document.getElementById('textInput');
            const durationInput = document.getElementById('durationInput');
            const text = textInput.value.trim();
            const duration = parseFloat(durationInput.value);

            if (text && !isNaN(duration) && duration > 0) {
                createTextFlow(text, duration);
                textInput.value = '';
                durationInput.value = '';
            } else {
                alert('请输入有效的文字内容和持续时间');
            }
        }
    </script>
</body>
</html>
